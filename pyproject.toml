[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corbell"
version = "2.0.0"
description = "Code retrieval engine — hybrid embedding + graph search for LLM context injection."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
  {name = "Corbell Contributors"}
]
keywords = ["code-search", "embeddings", "retrieval", "LLM", "context", "MCP"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
local    = ["sentence-transformers>=3.0", "transformers<5.0.0"]
openai   = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
google   = ["google-genai>=2.7.0"]
# Cloud providers
aws      = ["boto3>=1.34"]
azure    = ["openai>=1.0"]  # Azure OpenAI uses the openai SDK
gcp      = ["google-cloud-aiplatform>=1.38", "anthropic[vertex]>=0.25"]
mcp      = ["mcp>=1.1.2"]
# Tree-sitter grammars for accurate multi-language method extraction
treesitter = [
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-c-sharp>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-ruby>=0.21",
  "tree-sitter-php>=0.21",
]
dev      = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-asyncio",
  "respx",
  "httpx",
  "ruff",
  "mypy",
]

[project.scripts]
corbell = "corbell.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["corbell"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
