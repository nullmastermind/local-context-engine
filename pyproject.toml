[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-retrieval-context-engine"
version = "2.0.4"
description = "Code retrieval engine — hybrid embedding + graph search for LLM context injection."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
  {name = "nullmastermind"}
]
keywords = ["code-search", "embeddings", "retrieval", "LLM", "context", "MCP", "codebase-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "numpy>=2.0",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "mcp>=1.1.2",
  "pathspec>=0.11",
  "google-genai>=2.7.0",
  "voyageai>=0.3",
]

[project.optional-dependencies]
openai   = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
# Cloud providers
aws      = ["boto3>=1.34"]
azure    = ["openai>=1.0"]  # Azure OpenAI uses the openai SDK
gcp      = ["google-cloud-aiplatform>=1.38", "anthropic[vertex]>=0.25"]
# Tree-sitter grammars for accurate multi-language method extraction
treesitter = [
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-c-sharp>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-ruby>=0.21",
  "tree-sitter-php>=0.21",
]
dev      = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-asyncio",
  "respx",
  "httpx",
  "ruff",
  "mypy",
]
debug    = ["gradio>=4.0"]

[project.scripts]
corbell = "corbell.cli.main:main"
codebase-retrieval-context-engine = "corbell.core.mcp.server:main"

[project.urls]
Homepage = "https://github.com/nullmastermind/local-context-engine"
Repository = "https://github.com/nullmastermind/local-context-engine"
Issues = "https://github.com/nullmastermind/local-context-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["corbell"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
